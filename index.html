<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Rise at Seven | Award Winning Search-First Content Marketing Agency</title>
    <link rel="icon" type="image/png" sizes="228x228" href="/dist/favicons/coast-228x228.png">

    <!-- External Scripts & Fonts -->
    <script src="https://kit.fontawesome.com/711261502f.js" crossorigin="anonymous"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Tailwind Configuration for your Custom Font -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        // Mapping your specific font stack
                        'sans-primary': ['saans', 'Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'],
                    }
                }
            }
        }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- Loading Inter 600 for your backup -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* 
           If you have the Saans font file, it will load here. 
           Otherwise, it falls back to Inter (600) automatically.
        */
        @font-face {
            font-family: 'saans';
            src: url('path/to/saans-semibold.woff2') format('woff2');
            font-weight: 600;
        }

        [x-cloak] { display: none; }
        body {
            margin: 0;
            padding: 0;
        }
    </style>
</head>
<body class="bg-neutral-900 font-sans"> <!-- Added font-sans as default for body -->

    <!-- HERO SECTION -->
    <section id="hero-section" class="relative min-h-screen flex flex-col text-neutral-50 overflow-hidden">
        
        <!-- Background Image -->
        <div class="absolute inset-0 z-0">
            <div class="relative w-full h-full overflow-hidden">
                <div class="absolute inset-0 z-10" style="background-color: rgba(23, 23, 23, 0.3);"></div>
                <img src="https://rise-atseven.transforms.svdcdn.com/production/images/Emirates-airpline-in-flight.avif?w=1330&h=700&q=100&auto=format&fit=crop&dm=1750948034&s=7fc16049313aefb0ea160470af9ae379" 
                     alt="Blurred airplane background" 
                     class="w-full h-full object-cover blur-lg scale-110 brightness-[0.9] contrast-[1.1]"/>
            </div>
        </div>

        <!-- Announcement Bar -->
        <div class="relative z-20 w-full bg-neutral-100 text-neutral-900 py-2 px-4 text-center text-sm font-medium">
            <p class="flex items-center justify-center gap-2">
                <span class="inline-block w-4 h-4 bg-neutral-400 rounded-sm"></span>
                Where are your customers actually searching? Download the report
            </p>
        </div>

        <!-- Navigation -->
        <nav class="relative z-20 w-full max-w-7xl mx-auto px-6 py-6 flex justify-between items-center">
            <div class="text-2xl font-bold tracking-tight">
                Rise at Seven<span class="text-xs align-top">®</span>
            </div>

            <ul class="hidden md:flex items-center gap-8 text-sm font-medium">
                <li><a href="#" class="hover:opacity-70 transition flex items-center gap-1">Services <span class="text-[10px]">+</span></a></li>
                <li><a href="#" class="hover:opacity-70 transition flex items-center gap-1">About <span class="text-[10px]">+</span></a></li>
                <li><a href="#" class="hover:opacity-70 transition">Work</a></li>
                <li><a href="#" class="hover:opacity-70 transition">Blog</a></li>
            </ul>

            <button class="bg-neutral-50 text-neutral-900 px-6 py-2.5 rounded-full text-sm font-bold hover:bg-neutral-200 transition">
                Get In Touch <span class="text-xs">↗</span>
            </button>
        </nav>

        <!-- Main Content -->
        <div class="relative z-10 flex-grow flex flex-col items-center justify-center text-center px-6 pt-12 pb-24">
            <div class="mb-8 flex flex-col items-center gap-3">
                <span class="text-[10px] font-bold tracking-widest uppercase text-neutral-300">#1 MOST RECOMMENDED CONTENT MARKETING AGENCY</span>
            </div>

            <!-- THE UPDATED HEADING -->
         <h1 class="font-sans-primary text-[80px] md:text-[120px] font-semibold tracking-tight leading-[0.9] max-w-7xl">
    We Create <br />
    Category 
    <span class="inline-block align-middle mx-2">
        <div class="w-20 h-14 md:w-32 md:h-24 bg-neutral-200 rounded-2xl overflow-hidden shadow-xl transform -rotate-2">
            <img src="https://rise-atseven.transforms.svdcdn.com/production/images/Emirates-airpline-in-flight.avif?w=1330&h=700&q=100&auto=format&fit=crop&dm=1750948034&s=7fc16049313aefb0ea160470af9ae379" alt="Category detail" class="w-full h-full object-cover" />
        </div>
    </span>
    Leaders
</h1>

            <p class="mt-8 text-xl md:text-2xl font-medium text-neutral-200">
                on every searchable platform
            </p>
        </div>
    </section>
</body>
</html>
